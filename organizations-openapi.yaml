openapi: 3.0.3
info:
  title: Organizations API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /organizations:
    post:
      summary: Create organization
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/search:
    post:
      summary: Search organizations
      description: Получение массива организаций с фильтрацией, сортировкой и пагинацией.
      requestBody:
        required: false
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationListRequest'
      responses:
        '200':
          description: Organizations page
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/{id}:
    get:
      summary: Get organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Updated
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Mark organization as deleted by id
      description: Помечает организацию удаленной
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Marked as deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/type/{type}:
    delete:
      summary: Mark one organization as deleted by type
      description: Помечает удаленным один любой объект, значение type которого равно заданному.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrganizationType'
      responses:
        '204':
          description: Marked as deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/count-annual-turnover:
    get:
      summary: Count organizations by annualTurnover
      description: Возвращает количество объектов, у которых annualTurnover больше заданного значения.
      parameters:
        - name: annualTurnover
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: 0
            exclusiveMinimum: true
      responses:
        '200':
          description: Count
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CountResult'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    OrganizationListRequest:
      type: object
      xml:
        name: organizationListRequest
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        size:
          type: integer
          minimum: 1
          default: 10
        sort:
          type: array
          description: Поля сортировки в порядке приоритета. Префикс "-" означает DESC.
          xml:
            wrapped: true
          items:
            type: string
            pattern: ^-?(id|name|coordinates\.x|coordinates\.y|creationDate|annualTurnover|fullName|type|postalAddress\.street|postalAddress\.zipCode)$
            example: name
        filters:
          $ref: '#/components/schemas/OrganizationFilters'

    OrganizationFilters:
      type: object
      description: |
        Набор фильтров для списка организаций. Для числовых полей доступны eq, gt, gte, lt, lte.
        Для строковых полей доступны eq и contains для поиска по подстроке.
      xml:
        name: filters
      properties:
        id:
          $ref: '#/components/schemas/Int64Filter'
        name:
          $ref: '#/components/schemas/StringFilter'
        coordinates:
          $ref: '#/components/schemas/CoordinatesFilter'
        creationDate:
          $ref: '#/components/schemas/DateTimeFilter'
        annualTurnover:
          $ref: '#/components/schemas/FloatFilter'
        fullName:
          $ref: '#/components/schemas/StringFilter'
        type:
          $ref: '#/components/schemas/OrganizationTypeFilter'
        postalAddress:
          $ref: '#/components/schemas/AddressFilter'

    CoordinatesFilter:
      type: object
      properties:
        x:
          $ref: '#/components/schemas/Int64Filter'
        y:
          $ref: '#/components/schemas/Int64Filter'

    AddressFilter:
      type: object
      properties:
        street:
          $ref: '#/components/schemas/StringFilter'
        zipCode:
          $ref: '#/components/schemas/StringFilter'

    Int64Filter:
      type: object
      properties:
        eq:
          type: integer
          format: int64
        gt:
          type: integer
          format: int64
        gte:
          type: integer
          format: int64
        lt:
          type: integer
          format: int64
        lte:
          type: integer
          format: int64

    DateTimeFilter:
      type: object
      properties:
        eq:
          type: string
          format: date-time
        gt:
          type: string
          format: date-time
        gte:
          type: string
          format: date-time
        lt:
          type: string
          format: date-time
        lte:
          type: string
          format: date-time

    FloatFilter:
      type: object
      properties:
        eq:
          type: number
          format: float
        gt:
          type: number
          format: float
        gte:
          type: number
          format: float
        lt:
          type: number
          format: float
        lte:
          type: number
          format: float

    StringFilter:
      type: object
      properties:
        eq:
          type: string
          minLength: 1
        contains:
          type: string
          minLength: 1

    OrganizationTypeFilter:
      type: object
      properties:
        eq:
          $ref: '#/components/schemas/OrganizationType'
        in:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/OrganizationType'

    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          required:
            - id
            - creationDate
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              readOnly: true
            creationDate:
              type: string
              format: date-time
              readOnly: true
            deleted:
              type: boolean
              readOnly: true
      xml:
        name: organization

    OrganizationInput:
      type: object
      xml:
        name: organization
      required:
        - name
        - coordinates
        - annualTurnover
        - fullName
        - postalAddress
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        annualTurnover:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
        fullName:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        postalAddress:
          $ref: '#/components/schemas/Address'

    Coordinates:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
          format: int64
          maximum: 775
        y:
          type: integer
          format: int64

    Address:
      type: object
      required:
        - street
        - zipCode
      properties:
        street:
          type: string
          minLength: 1
        zipCode:
          type: string

    OrganizationType:
      type: string
      nullable: true
      enum:
        - PUBLIC
        - TRUST
        - OPEN_JOINT_STOCK_COMPANY

    OrganizationList:
      type: object
      xml:
        name: organizations
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        items:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Organization'

    CountResult:
      type: object
      xml:
        name: countResult
      properties:
        count:
          type: integer
          minimum: 0

    Error:
      type: object
      xml:
        name: error
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
