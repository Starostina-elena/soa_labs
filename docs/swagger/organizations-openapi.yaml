openapi: 3.0.3
info:
  title: Organizations API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /organizations:
    get:
      summary: Search organizations
      description: |
        Получение массива организаций с фильтрацией, сортировкой и пагинацией.
        Фильтры передаются как `<поле>.<оператор>`, например `name.contains` или `annualTurnover.gte`.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: sort
          in: query
          description: Поля сортировки в порядке приоритета. Префикс "-" означает DESC.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              pattern: ^-?(id|name|coordinates\.x|coordinates\.y|creationDate|annualTurnover|fullName|type|postalAddress\.street|postalAddress\.zipCode)$
              example: name
        - name: id.eq
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: id.gt
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: id.gte
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: id.lt
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: id.lte
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: name.eq
          in: query
          schema:
            $ref: '#/components/schemas/StringFilterValue'
        - name: name.contains
          in: query
          schema:
            $ref: '#/components/schemas/StringFilterValue'
        - name: coordinates.x.eq
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.x.gt
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.x.gte
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.x.lt
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.x.lte
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.y.eq
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.y.gt
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.y.gte
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.y.lt
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: coordinates.y.lte
          in: query
          schema:
            $ref: '#/components/schemas/Int64FilterValue'
        - name: creationDate.eq
          in: query
          schema:
            $ref: '#/components/schemas/DateTimeFilterValue'
        - name: creationDate.gt
          in: query
          schema:
            $ref: '#/components/schemas/DateTimeFilterValue'
        - name: creationDate.gte
          in: query
          schema:
            $ref: '#/components/schemas/DateTimeFilterValue'
        - name: creationDate.lt
          in: query
          schema:
            $ref: '#/components/schemas/DateTimeFilterValue'
        - name: creationDate.lte
          in: query
          schema:
            $ref: '#/components/schemas/DateTimeFilterValue'
        - name: annualTurnover.eq
          in: query
          schema:
            $ref: '#/components/schemas/FloatFilterValue'
        - name: annualTurnover.gt
          in: query
          schema:
            $ref: '#/components/schemas/FloatFilterValue'
        - name: annualTurnover.gte
          in: query
          schema:
            $ref: '#/components/schemas/FloatFilterValue'
        - name: annualTurnover.lt
          in: query
          schema:
            $ref: '#/components/schemas/FloatFilterValue'
        - name: annualTurnover.lte
          in: query
          schema:
            $ref: '#/components/schemas/FloatFilterValue'
        - name: fullName.eq
          in: query
          schema:
            $ref: '#/components/schemas/StringFilterValue'
        - name: fullName.contains
          in: query
          schema:
            $ref: '#/components/schemas/StringFilterValue'
        - name: type.eq
          in: query
          schema:
            $ref: '#/components/schemas/OrganizationType'
        - name: type.in
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrganizationType'
        - name: postalAddress.street.eq
          in: query
          schema:
            $ref: '#/components/schemas/StringFilterValue'
        - name: postalAddress.street.contains
          in: query
          schema:
            $ref: '#/components/schemas/StringFilterValue'
        - name: postalAddress.zipCode.eq
          in: query
          schema:
            $ref: '#/components/schemas/StringFilterValue'
        - name: postalAddress.zipCode.contains
          in: query
          schema:
            $ref: '#/components/schemas/StringFilterValue'
      responses:
        '200':
          description: Organizations page
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      summary: Create organization
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/{id}:
    get:
      summary: Get organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Updated
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Mark organization as deleted by id
      description: Помечает организацию удаленной
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Marked as deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/type/{type}:
    delete:
      summary: Mark one organization as deleted by type
      description: Помечает удаленным один любой объект, значение type которого равно заданному.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrganizationType'
      responses:
        '204':
          description: Marked as deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/count-annual-turnover:
    get:
      summary: Count organizations by annualTurnover
      description: Возвращает количество объектов, у которых annualTurnover больше заданного значения.
      parameters:
        - name: annualTurnover
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: 0
            exclusiveMinimum: true
      responses:
        '200':
          description: Count
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CountResult'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Int64FilterValue:
      type: integer
      format: int64

    DateTimeFilterValue:
      type: string
      format: date-time

    FloatFilterValue:
      type: number
      format: float

    StringFilterValue:
      type: string
      minLength: 1

    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          required:
            - id
            - creationDate
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              readOnly: true
            creationDate:
              type: string
              format: date-time
              readOnly: true
            deleted:
              type: boolean
              readOnly: true
      xml:
        name: organization

    OrganizationInput:
      type: object
      xml:
        name: organization
      required:
        - name
        - coordinates
        - annualTurnover
        - fullName
        - postalAddress
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        annualTurnover:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
        fullName:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        postalAddress:
          $ref: '#/components/schemas/Address'

    Coordinates:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
          format: int64
          maximum: 775
        y:
          type: integer
          format: int64

    Address:
      type: object
      required:
        - street
        - zipCode
      properties:
        street:
          type: string
          minLength: 1
        zipCode:
          type: string

    OrganizationType:
      type: string
      nullable: true
      enum:
        - PUBLIC
        - TRUST
        - OPEN_JOINT_STOCK_COMPANY

    OrganizationList:
      type: object
      xml:
        name: organizations
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        items:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Organization'

    CountResult:
      type: object
      xml:
        name: countResult
      properties:
        count:
          type: integer
          minimum: 0

    Error:
      type: object
      xml:
        name: error
      required:
        - timestamp
        - message
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        errors:
          type: array
          description: Ошибки по всем невалидным параметрам и полям запроса.
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      xml:
        name: errorDetail
      required:
        - parameter
        - message
      properties:
        parameter:
          type: string
          description: Имя параметра или поля, в котором найдена ошибка.
        message:
          type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
