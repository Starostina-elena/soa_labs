openapi: 3.0.3
info:
  title: Organizations API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /organizations:
    get:
      summary: Search organizations
      description: |
        Получение массива организаций с фильтрацией, сортировкой и пагинацией
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 2
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
            example: 20
        - name: sort
          in: query
          description: |
            Поля сортировки в порядке приоритета. Префикс `-` означает DESC.
            Параметр можно повторять: `sort=name&sort=-annualTurnover`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              pattern: ^-?(id|name|coordinates\.x|coordinates\.y|creationDate|annualTurnover|fullName|type|postalAddress\.street|postalAddress\.zipCode)$
              example: name
          example:
            - name
            - -annualTurnover
        - name: filter
          in: query
          description: |
            Критерии фильтрации в формате `поле.оператор=значение`
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrganizationFilter'
          examples:
            byId:
              summary: По идентификатору
              value:
                - id.eq=75
            byText:
              summary: По строковым полям
              value:
                - name.contains=Lab
                - fullName.eq=Research Laboratory
                - postalAddress.street.contains=Lenina
                - postalAddress.zipCode.eq=101000
            byNumbersAndDate:
              summary: По числам и дате
              value:
                - coordinates.x.lte=500
                - coordinates.y.gt=-10
                - annualTurnover.gte=1000000.5
                - creationDate.lt=2026-01-01T00:00:00Z
            byType:
              summary: По нескольким типам
              value:
                - type.in=PUBLIC,TRUST
            combined:
              summary: Несколько условий
              value:
                - id.gte=10
                - name.contains=Lab
                - type.eq=PUBLIC
      responses:
        '200':
          description: Organizations page
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      summary: Create organization
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/{id}:
    get:
      summary: Get organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Updated
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Mark organization as deleted by id
      description: Помечает организацию удаленной
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Marked as deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/type/{type}:
    delete:
      summary: Mark one organization as deleted by type
      description: Помечает удаленным один любой объект, значение type которого равно заданному.
      parameters:
        - name: type
          in: path
          required: true
          example: PUBLIC
          schema:
            $ref: '#/components/schemas/OrganizationType'
      responses:
        '204':
          description: Marked as deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/count-annual-turnover:
    get:
      summary: Count organizations by annualTurnover
      description: Возвращает количество объектов, у которых annualTurnover больше заданного значения.
      parameters:
        - name: annualTurnover
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: 0
            exclusiveMinimum: true
            example: 1000000.5
      responses:
        '200':
          description: Count
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CountResult'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 75

  schemas:
    OrganizationFilter:
      type: string
      description: Один критерий фильтрации в формате `поле.оператор=значение`.
      pattern: >-
        ^(?:(?:id|coordinates\.x|coordinates\.y)\.(?:eq|gt|gte|lt|lte)=-?\d+|annualTurnover\.(?:eq|gt|gte|lt|lte)=-?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?|creationDate\.(?:eq|gt|gte|lt|lte)=[^&]+|(?:name|fullName|postalAddress\.street|postalAddress\.zipCode)\.(?:eq|contains)=.+|type\.eq=(?:PUBLIC|TRUST|OPEN_JOINT_STOCK_COMPANY)|type\.in=(?:PUBLIC|TRUST|OPEN_JOINT_STOCK_COMPANY)(?:,(?:PUBLIC|TRUST|OPEN_JOINT_STOCK_COMPANY))*)$
      example: id.eq=75

    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          required:
            - id
            - creationDate
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              readOnly: true
              example: 75
            creationDate:
              type: string
              format: date-time
              readOnly: true
              example: '2026-09-15T12:30:00Z'
            deleted:
              type: boolean
              readOnly: true
              example: false
      xml:
        name: organization

    OrganizationInput:
      type: object
      xml:
        name: organization
      required:
        - name
        - coordinates
        - annualTurnover
        - fullName
        - postalAddress
      properties:
        name:
          type: string
          minLength: 1
          example: Research Lab
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        annualTurnover:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          example: 1500000.5
        fullName:
          type: string
          example: Research Laboratory LLC
        type:
          $ref: '#/components/schemas/OrganizationType'
        postalAddress:
          $ref: '#/components/schemas/Address'

    Coordinates:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
          format: int64
          maximum: 775
          example: 120
        y:
          type: integer
          format: int64
          example: -45

    Address:
      type: object
      required:
        - street
        - zipCode
      properties:
        street:
          type: string
          minLength: 1
          example: Lenina street, 10
        zipCode:
          type: string
          example: '101000'

    OrganizationType:
      type: string
      nullable: true
      enum:
        - PUBLIC
        - TRUST
        - OPEN_JOINT_STOCK_COMPANY
      example: PUBLIC

    OrganizationList:
      type: object
      xml:
        name: organizations
      properties:
        page:
          type: integer
          example: 2
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        items:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Organization'

    CountResult:
      type: object
      xml:
        name: countResult
      properties:
        count:
          type: integer
          minimum: 0
          example: 12

    Error:
      type: object
      xml:
        name: error
      required:
        - timestamp
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-15T12:30:00Z'
        message:
          type: string
          example: Request validation failed
        errors:
          type: array
          description: Ошибки по всем невалидным параметрам и полям запроса.
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      xml:
        name: errorDetail
      required:
        - parameter
        - message
      properties:
        parameter:
          type: string
          description: Имя параметра или поля, в котором найдена ошибка.
          example: filter[0]
        message:
          type: string
          example: 'Invalid filter expression: id.eq=abc'

  responses:
    BadRequest:
      description: Validation error
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
