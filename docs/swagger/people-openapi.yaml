openapi: 3.0.3
info:
  title: People API
  version: 1.0.0
  description: >
    Сервис управления сотрудниками

servers:
  - url: http://localhost:8081/orgmanager

paths:
  /persons:
    get:
      summary: Get persons
      responses:
        '200':
          description: Persons
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PersonList'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'

    post:
      summary: Create person
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: Created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'

  /persons/{id}:
    get:
      summary: Get person by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'

    patch:
      summary: Update person by id
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: Updated
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'

    delete:
      summary: Mark person as deleted by id
      description: Помечает сотрудника удаленным
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Marked as deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'

  /merge/{id1}/{id2}/new-name/new-address:
    post:
      summary: Объединить две организации
      description: >
        Объединить организации, создав новую и зачислив в неё всех сотрудников двух исходных
      parameters:
        - name: id1
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 75
        - name: id2
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 108
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Merged organization created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'

  /fire/all/{id}:
    post:
      summary: Уволить всех сотрудников организации
      description: Уволить всех сотрудников организации с указанным id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: All employees fired
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/OrganizationServiceUnavailable'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 75

  schemas:
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonInput'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              readOnly: true
              example: 501
            deleted:
              type: boolean
              readOnly: true
              example: false
            organizations:
              type: array
              description: Организации, в которых работает человек.
              readOnly: true
              xml:
                wrapped: true
              items:
                $ref: '#/components/schemas/OrganizationRef'
      xml:
        name: person

    PersonInput:
      type: object
      xml:
        name: person
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: Anna Petrova
        organizationIds:
          type: array
          description: ID организаций для связи many-to-many.
          xml:
            wrapped: true
          items:
            type: integer
            format: int64
            minimum: 1
            example: 75

    PersonList:
      type: object
      xml:
        name: persons
      properties:
        items:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Person'

    OrganizationRef:
      type: object
      description: Короткая ссылка на организацию из сервиса организаций.
      xml:
        name: organization
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 75
        name:
          type: string
          example: Research Lab

    OrganizationInput:
      type: object
      description: Данные новой организации
      xml:
        name: organization
      required:
        - name
        - coordinates
        - annualTurnover
        - fullName
        - postalAddress
      properties:
        name:
          type: string
          minLength: 1
          example: Merged Research Group
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        annualTurnover:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          example: 2500000.5
        fullName:
          type: string
          example: Merged Research Group LLC
        type:
          $ref: '#/components/schemas/OrganizationType'
        postalAddress:
          $ref: '#/components/schemas/Address'

    Coordinates:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
          format: int64
          maximum: 775
          example: 120
        y:
          type: integer
          format: int64
          example: -45

    Address:
      type: object
      required:
        - street
        - zipCode
      properties:
        street:
          type: string
          minLength: 1
          example: Lenina street, 10
        zipCode:
          type: string
          example: '101000'

    OrganizationType:
      type: string
      nullable: true
      enum:
        - PUBLIC
        - TRUST
        - OPEN_JOINT_STOCK_COMPANY
      example: PUBLIC

    Error:
      type: object
      xml:
        name: error
      required:
        - timestamp
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-15T12:30:00Z'
        message:
          type: string
          example: Request validation failed
        errors:
          type: array
          description: Ошибки по всем невалидным параметрам и полям запроса.
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      xml:
        name: errorDetail
      required:
        - parameter
        - message
      properties:
        parameter:
          type: string
          description: Имя параметра или поля, в котором найдена ошибка.
          example: organizationIds[0]
        message:
          type: string
          example: Organization with id 75 was not found

  responses:
    BadRequest:
      description: Validation error
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
    OrganizationServiceUnavailable:
      description: Organizations service unavailable
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
