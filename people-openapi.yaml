openapi: 3.0.3
info:
  title: People API
  version: 1.0.0
  description: >
    Сервис управления сотрудниками

servers:
  - url: http://localhost:8081/orgmanager

paths:
  /persons:
    get:
      summary: Get persons
      responses:
        '200':
          description: Persons
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/PersonList'

    post:
      summary: Create person
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          description: Created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'

  /persons/{id}:
    get:
      summary: Get person by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update person by id
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '200':
          description: Updated
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete person by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /merge/{id1}/{id2}/new-name/new-address:
    post:
      summary: Объединить две организации
      description: >
        Объединить организации, создав новую и зачислив в неё всех сотрудников двух исходных
      parameters:
        - name: id1
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: id2
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Merged organization created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /fire/all/{id}:
    post:
      summary: Уволить всех сотрудников организации
      description: Уволить всех сотрудников организации с указанным id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: All employees fired
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonInput'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              readOnly: true
            organizations:
              type: array
              description: Организации, в которых работает человек.
              readOnly: true
              xml:
                wrapped: true
              items:
                $ref: '#/components/schemas/OrganizationRef'
      xml:
        name: person

    PersonInput:
      type: object
      xml:
        name: person
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        organizationIds:
          type: array
          description: ID организаций для связи many-to-many.
          xml:
            wrapped: true
          items:
            type: integer
            format: int64
            minimum: 1

    PersonList:
      type: object
      xml:
        name: persons
      properties:
        items:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Person'

    OrganizationRef:
      type: object
      description: Короткая ссылка на организацию из сервиса организаций.
      xml:
        name: organization
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string

    OrganizationInput:
      type: object
      description: Данные новой организации
      xml:
        name: organization
      required:
        - name
        - coordinates
        - annualTurnover
        - fullName
        - postalAddress
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        annualTurnover:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
        fullName:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        postalAddress:
          $ref: '#/components/schemas/Address'

    Coordinates:
      type: object
      required:
        - x
      properties:
        x:
          type: integer
          format: int64
          maximum: 775
        y:
          type: integer
          format: int64

    Address:
      type: object
      required:
        - street
        - zipCode
      properties:
        street:
          type: string
          minLength: 1
        zipCode:
          type: string

    OrganizationType:
      type: string
      nullable: true
      enum:
        - PUBLIC
        - TRUST
        - OPEN_JOINT_STOCK_COMPANY

    Error:
      type: object
      xml:
        name: error
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
