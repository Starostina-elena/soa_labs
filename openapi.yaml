openapi: 3.0.3
info:
  title: Organizations API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

paths:
  /organizations:
    get:
      summary: Get organizations
      description: Получение массива организаций с фильтрацией, сортировкой и пагинацией.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: sort
          in: query
          description: Поля через запятую. Минус означает DESC name,-annualTurnover.
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: name
          in: query
          schema:
            type: string
            minLength: 1
        - name: coordinates.x
          in: query
          schema:
            type: integer
            format: int64
            maximum: 775
        - name: coordinates.y
          in: query
          schema:
            type: integer
            format: int64
        - name: creationDate
          in: query
          schema:
            type: string
            format: date-time
        - name: annualTurnover
          in: query
          schema:
            type: number
            format: float
            minimum: 0
            exclusiveMinimum: true
        - name: fullName
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/OrganizationType'
        - name: postalAddress.street
          in: query
          schema:
            type: string
            minLength: 1
        - name: postalAddress.zipCode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Organizations page
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      summary: Create organization
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Created
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/{id}:
    get:
      summary: Get organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Updated
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete organization by id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/type/{type}:
    delete:
      summary: Delete one organization by type
      description: Удаляет один любой объект, значение type которого равно заданному.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrganizationType'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/count-by-annual-turnover:
    get:
      summary: Count organizations by annualTurnover
      description: Возвращает количество объектов, у которых annualTurnover больше заданного значения.
      parameters:
        - name: annualTurnover
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: 0
            exclusiveMinimum: true
      responses:
        '200':
          description: Count
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CountResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/search-by-full-name:
    get:
      summary: Search organizations by fullName
      description: Возвращает массив объектов, у которых fullName содержит заданную подстроку.
      parameters:
        - name: substring
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Matching organizations
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          required:
            - id
            - creationDate
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              readOnly: true
            creationDate:
              type: string
              format: date-time
              readOnly: true
      xml:
        name: organization

    OrganizationInput:
      type: object
      xml:
        name: organization
      required:
        - name
        - coordinates
        - annualTurnover
        - fullName
        - postalAddress
      properties:
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        annualTurnover:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
        fullName:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        postalAddress:
          $ref: '#/components/schemas/Address'

    Coordinates:
      type: object
      required:
        - x
      properties:
        x:
          type: integer
          format: int64
          maximum: 775
        y:
          type: integer
          format: int64

    Address:
      type: object
      required:
        - street
        - zipCode
      properties:
        street:
          type: string
          minLength: 1
        zipCode:
          type: string

    OrganizationType:
      type: string
      nullable: true
      enum:
        - PUBLIC
        - TRUST
        - OPEN_JOINT_STOCK_COMPANY

    OrganizationList:
      type: object
      xml:
        name: organizations
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        items:
          type: array
          xml:
            wrapped: true
          items:
            $ref: '#/components/schemas/Organization'

    Error:
      type: object
      xml:
        name: error
      properties:
        message:
          type: string

    CountResult:
      type: object
      xml:
        name: countResult
      properties:
        count:
          type: integer
          minimum: 0

  responses:
    BadRequest:
      description: Validation error
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/Error'
